name: Wake Streamlit App

on:
  schedule:
    - cron: "0 */4 * * *" # Запуск каждые 4 часа
  workflow_dispatch: # Позволяет запускать экшен вручную

jobs:
  wake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Selenium script
        # Раскомментируйте следующие 2 строки, если добавите STREAMLIT_APP_URL в GitHub Secrets репозитория
        # env:
        #   STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: python main.py
